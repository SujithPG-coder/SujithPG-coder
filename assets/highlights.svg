<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Portfolio highlights">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <style>
      .t  { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #7dd3fc; letter-spacing: 1.5px; }
      .n  { font: 800 40px 'Segoe UI', Arial, sans-serif; }
      .l  { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .card { opacity: 0; animation: up .8s ease-out forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      .bar { animation: grow 1.6s ease-out forwards; transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
      @keyframes grow { to { transform: scaleX(1) } }
    </style>
  </defs>
  <rect width="900" height="190" rx="14" fill="url(#bg)" stroke="#1e3a5f"/>
  <text x="28" y="36" class="t">PROFILE AT A GLANCE</text>

  <g class="card" style="animation-delay:.1s">
    <rect x="24" y="54" width="198" height="112" rx="10" fill="#0e1a2f" stroke="#1e3a5f"/>
    <text x="44" y="108" class="n" fill="#22d3ee">8</text>
    <text x="44" y="134" class="l">Engineering projects</text>
    <rect class="bar" x="44" y="148" width="158" height="4" rx="2" fill="#22d3ee" style="animation-delay:.3s"/>
  </g>
  <g class="card" style="animation-delay:.3s">
    <rect x="238" y="54" width="198" height="112" rx="10" fill="#0e1a2f" stroke="#1e3a5f"/>
    <text x="258" y="108" class="n" fill="#a78bfa">1</text>
    <text x="258" y="134" class="l">IEEE Xplore publication</text>
    <rect class="bar" x="258" y="148" width="158" height="4" rx="2" fill="#a78bfa" style="animation-delay:.5s"/>
  </g>
  <g class="card" style="animation-delay:.5s">
    <rect x="452" y="54" width="198" height="112" rx="10" fill="#0e1a2f" stroke="#1e3a5f"/>
    <text x="472" y="108" class="n" fill="#34d399">2</text>
    <text x="472" y="134" class="l">Industry internships</text>
    <rect class="bar" x="472" y="148" width="158" height="4" rx="2" fill="#34d399" style="animation-delay:.7s"/>
  </g>
  <g class="card" style="animation-delay:.7s">
    <rect x="666" y="54" width="210" height="112" rx="10" fill="#0e1a2f" stroke="#1e3a5f"/>
    <text x="686" y="108" class="n" fill="#f472b6">2</text>
    <text x="686" y="134" class="l">Certifications</text>
    <rect class="bar" x="686" y="148" width="170" height="4" rx="2" fill="#f472b6" style="animation-delay:.9s"/>
  </g>
</svg>
